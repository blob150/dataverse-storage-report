name: Release

# Builds the Dataverse Storage Report solution from `power-platform/solution/src/`
# and publishes managed + unmanaged zips to a GitHub Release whenever a tag
# matching `v*` (e.g. `v1.0.0`) is pushed.
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0     (or: git push personal v1.0.0)
#
# A draft release is created on first run; edit it on GitHub to publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for a manual run (e.g. v1.0.0-test)'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Power Platform CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build React code app
        run: |
          npm ci
          npm run build

      - name: Stage code app bundle into solution source
        # `pac solution pack` requires the canvas app's CodeAppPackages folder to
        # contain the built bundle (index.html + assets), AND the CodeAppPackageUris
        # listed in the .meta.xml must reference real files. Vite emits hashed
        # asset filenames that change per build, so we rewrite the meta.xml to
        # match whatever was actually produced.
        run: |
          BUNDLE_DIR="power-platform/solution/src/CanvasApps/dsr_dataversestoragereport_ef777_CodeAppPackages"
          META_XML="power-platform/solution/src/CanvasApps/dsr_dataversestoragereport_ef777.meta.xml"

          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          cp -r dist/. "$BUNDLE_DIR/"
          ls -la "$BUNDLE_DIR" "$BUNDLE_DIR/assets"

          python3 <<'PY'
          import os, re, glob
          bundle = "power-platform/solution/src/CanvasApps/dsr_dataversestoragereport_ef777_CodeAppPackages"
          meta = "power-platform/solution/src/CanvasApps/dsr_dataversestoragereport_ef777.meta.xml"

          ctype = {
            ".html": "text/html",
            ".css":  "text/css",
            ".js":   "application/javascript",
            ".svg":  "image/svg+xml",
            ".png":  "image/png",
            ".ico":  "image/x-icon",
            ".json": "application/json",
            ".woff": "font/woff",
            ".woff2": "font/woff2",
          }
          uris = []
          for path in sorted(glob.glob(f"{bundle}/**", recursive=True)):
              if not os.path.isfile(path):
                  continue
              rel = os.path.relpath(path, bundle).replace(os.sep, "/")
              ext = os.path.splitext(rel)[1].lower()
              t = ctype.get(ext, "application/octet-stream")
              uris.append(f"    <CodeAppPackageUri>/CanvasApps/dsr_dataversestoragereport_ef777_CodeAppPackages/{rel}_ContentType_{t}</CodeAppPackageUri>")

          with open(meta, "r", encoding="utf-8") as f:
              xml = f.read()

          new_block = "<CodeAppPackageUris>\n" + "\n".join(uris) + "\n  </CodeAppPackageUris>"
          xml = re.sub(r"<CodeAppPackageUris>.*?</CodeAppPackageUris>", new_block, xml, count=1, flags=re.DOTALL)

          with open(meta, "w", encoding="utf-8") as f:
              f.write(xml)
          print(f"Rewrote {meta} with {len(uris)} CodeAppPackageUri entries.")
          PY

      - name: Pack unmanaged solution
        run: |
          pac solution pack \
            --zipfile DataverseStorageReport_unmanaged.zip \
            --folder  power-platform/solution/src \
            --packagetype Unmanaged

      # Note: A managed zip is intentionally NOT produced here. Source under
      # power-platform/solution/src/ is unmanaged (Solution.xml has
      # <Managed>0</Managed>) and `pac solution pack --packagetype Managed`
      # rejects unmanaged source. The supported way to obtain a managed zip
      # is to import the unmanaged zip into a build environment and export
      # it as managed from there.

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            DataverseStorageReport_unmanaged.zip

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: solution-${{ steps.ver.outputs.version }}
          path: |
            DataverseStorageReport_unmanaged.zip
